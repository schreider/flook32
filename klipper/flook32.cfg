#####################################################################
#                   FLOOK32 Sensor for Klipper                      #
#####################################################################
#                                                                    
#   Подключение контроллера нагрева камеры FLOOK32                   
#                                                                    
#   🔧 УСТАНОВКА:                                                   
#   1. Скопируйте flook32.py в ~/klipper/klippy/extras/             
#   2. Установите websocket-client (опционально):                   
#      pip install websocket-client 
#   3. Скопируйте файл flook32.cfg в папку с printer.cfg
#   4. Добавьте [include flook32.cfg] в printer.cfg                    
#   5. Перезапустите Klipper                                        
#                                                                    
#   📌 ВАЖНО: ВСЕ ПАРАМЕТРЫ НИЖЕ ОПЦИОНАЛЬНЫЕ                       
#   Плагин отправляет на ESP32 ТОЛЬКО те параметры, которые вы       
#   явно укажете в конфиге. Остальные остаются как на устройстве.   
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   # ========== СНАЧАЛА МОДУЛЬ (обязательно, даже пустой) ==========
[flook32]

# ========== ПОТОМ ДАТЧИК ==========
[temperature_sensor chamber]
sensor_type: flook32
                                                                                                                              
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔧 ПОЛНЫЙ СПИСОК ПАРАМЕТРОВ:                                    
#   -----------------------------------------------------------------
#                                                                    
#   === БАЗОВЫЕ НАСТРОЙКИ ===                                        
#   -----------------------------------------------------------------
#   sensor_type: flook32           # тип датчика (обязательно)              
#   flook_ip: 192.168.1.37         # IP адрес (опционально)          
#   flook_port: 80                 # порт HTTP/WebSocket             
#   auto_discover: True            # авто-поиск по UDP (по умолч. True)
#   report_interval: 10.0          # ⚠️ ТОЛЬКО ДЛЯ HTTP РЕЖИМА ⚠️    
#                                  # Интервал опроса через HTTP (сек)
#                                  # Диапазон: 5-60 сек, по умолч. 10 сек
#                                  # НЕ влияет на WebSocket!
#   silent: False                  # Тихий режим                    
#                                  # True  - НЕ выводить сообщения в консоль
#                                  # False - выводить все сообщения в консоль
#
#   === НАСТРОЙКИ АВТОУВЕДОМЛЕНИЙ ОБ ОШИБКАХ ===                     
#   -----------------------------------------------------------------
#   enable_error_notifications: True   # Включить автоуведомления об ошибках
#   error_notification_max_age: 600    # Максимальный возраст ошибки (сек)
#   error_check_interval: 30           # Как часто проверять API (сек)
#   show_trends: True                  # Показывать тренды ошибок
#   max_trend_lines: 30                # Максимальное количество строк трендов
#                                                                    
#   === НАСТРОЙКИ НАГРЕВАТЕЛЯ ===                                    
#   -----------------------------------------------------------------
#   max_heater_temp: 100.0         # макс. температура нагревателя (°C)
#   critical_temp: 110.0           # критическая температура (°C)    
#   critical_hysteresis: 5.0       # гистерезис снятия аварии (°C)   
#   max_air_temp: 70.0             # макс. температура воздуха (°C)  
#   air_hysteresis: 3.0            # гистерезис перегрева воздуха (°C)
#   hysteresis: 0.5                # гистерезис включения нагрева (°C)
#   heater_hysteresis: 4.0         # гистерезис нагревателя (°C)     
#   enable_heater_hysteresis: True # включить управление нагревателем
#   default_target_temp: 0         # целевая температура по умолчанию
#   invert_heater_signal: False    # инвертировать сигнал SSR        
#   max_fan_duty: 1023             # макс. мощность вентилятора (0-1023)
#   settings_locked: True          # блокировка настроек
#                                                                    
#   === НАСТРОЙКИ ВЕНТИЛЯТОРА ===                                    
#   -----------------------------------------------------------------
#   fan_on_temp: 55.0              # температура включения вентилятора
#   fan_off_hysteresis: 3.0        # гистерезис выключения (°C)      
#   fan_min_on_time: 30            # мин. время работы (сек)         
#   invert_fan_signal: False       # инвертировать сигнал вентилятора
#   fan_efficiency_timeout: 120    # таймаут проверки эффективности (сек)
#   fan_efficiency_threshold: 2.0  # порог эффективности (°C)        
#   enable_fan_efficiency_check: True # проверка эффективности вентилятора
#   enable_fan_auto_limit: False   # автоограничение мощности вентилятора
#   fan_auto_limit_hysteresis: 3.0 # гистерезис автоограничения (°C)
#   fan_auto_limit_adjust_step: 10 # шаг изменения duty
#   fan_auto_limit_min_duty: 400   # минимальный duty
#   fan_auto_limit_check_interval: 5000  # интервал проверки (мс)
#   fan_auto_limit_stable_count: 3 # замеров для стабилизации
#                                                                    
#   === ЗАЩИТА THERMAL RUNAWAY (ЧЕТЫРЁХФАЗНАЯ) ===                   
#   -----------------------------------------------------------------
#   enable_thermal_runaway: True   # включить защиту runaway         
#   runaway_quick_check_temp: 60.0 # Фаза 0: мин. температура через 45 сек (°C)
#   runaway_phase1_time: 5         # время фазы 1 (мин)              
#   runaway_phase2_time: 15        # время фазы 2 (мин)              
#   runaway_max_time_to_target: 30 # макс. время до цели (мин)       
#   runaway_min_heater_rise: 2.0   # мин. нагрев нагревателя (°C/мин)
#   runaway_min_air_rise: 0.5      # мин. нагрев воздуха (°C/мин)    
#   runaway_max_heater_drop: 15.0  # макс. падение нагревателя (°C)  
#   runaway_hysteresis: 2.0        # гистерезис runaway (°C)         
#   runaway_recovery_timeout: 30   # таймаут восстановления (сек)    
#   runaway_fan_on: False          # включить вентилятор при runaway 
#                                                                    
#   === ЗАЩИТА ОТ НЕОЖИДАННОГО НАГРЕВА ===                           
#   -----------------------------------------------------------------
#   enable_unexpected_heat: True   # включить защиту                 
#   unexpected_heat_timeout: 45    # таймаут (сек)                   
#   unexpected_heat_threshold: 15  # порог нагрева (°C)              
#   min_cooling_rate: 1.0          # мин. скорость охлаждения (°C/сек)
#   unexpected_heat_hysteresis: 3.0 # гистерезис (°C)                
#   unexpected_heat_clear_time: 30000 # время сброса (мс)            
#   unexpected_heat_safe_offset: 10 # безопасный оффсет (°C)         
#   enable_unexpected_heat_adaptive: False # адаптивный порог        
#   adaptive_base_temp: 20.0       # базовая температура (°C)        
#   adaptive_coefficient: 0.3      # коэффициент адаптации           
#   adaptive_min_offset: 30.0      # мин. адаптивный оффсет (°C)     
#                                                                    
#   === КОНТРОЛЬ СКОРОСТИ РОСТА ===                                  
#   -----------------------------------------------------------------
#   enable_abnormal_rate: True     # включить контроль               
#   abnormal_rate_threshold: 5.0   # порог аномальной скорости (°C/сек)
#                                                                    
#   === MAX6675 ПАРАМЕТРЫ ===                                        
#   -----------------------------------------------------------------
#   max6675_offset: 0.0            # калибровка оффсет (°C)          
#   enable_max6675_protection: True # защита датчика                 
#   max6675_stability_samples: 3   # выборки для стабильности        
#   max6675_temp_jump_threshold: 20 # порог скачка температуры (°C)  
#   max6675_min_temp: -50.0        # мин. температура (°C)           
#   max6675_max_temp: 400.0        # макс. температура (°C)          
#                                                                    
#   === DS18B20 ПАРАМЕТРЫ ===                                        
#   -----------------------------------------------------------------
#   ds18b20_offset: 0.0            # калибровка оффсет (°C)          
#   ds18b20_scale: 1.0             # масштаб (коэффициент)           
#   ds18b20_cal_enabled: False     # включить калибровку             
#   enable_air_sensor_protection: True # защита датчика воздуха      
#   air_sensor_stability_samples: 5 # выборки для стабильности       
#   air_sensor_temp_jump_threshold: 2.0 # порог скачка (°C)          
#   air_sensor_min_temp: -40.0     # мин. температура (°C)           
#   air_sensor_max_temp: 125.0     # макс. температура (°C)          
#   air_sensor_unstable_range: 3.0 # диапазон нестабильности (°C)    
#   air_sensor_unstable_deviation: 1.5 # отклонение (°C)             
#   air_sensor_unstable_window: 10 # окно нестабильности (измерений) 
#   air_sensor_direction_changes: 3 # смены направления              
#                                                                    
#   === ОШИБКИ И БЛОКИРОВКИ ===                                      
#   -----------------------------------------------------------------
#   max_error_retries: 3           # макс. повторов ошибки           
#   error_window_minutes: 10       # окно для подсчета ошибок (мин)  
#   min_time_between_same_errors: 30000 # мин. время между ошибками (мс)
#   min_time_between_overheat_counts: 5000 # мин. время между перегревами (мс)
#   unlock_password: unlock        # пароль для разблокировки        
#                                                                    
#   === LED ИНДИКАЦИЯ ===                                            
#   -----------------------------------------------------------------
#   led_enabled: True              # включить LED                    
#   led_count: 3                   # количество светодиодов          
#   led_brightness: 50             # яркость (0-255)                 
#   led_pin: 27                    # пин LED                         
#                                                                    
#   === HEARTBEAT ===                                                
#   -----------------------------------------------------------------
#   heartbeat_pulse_ms: 100        # длительность импульса (мс)      
#   heartbeat_pause_ms: 900        # пауза между импульсами (мс)     
#                                                                    
#   === ИНТЕРВАЛЫ ===                                                
#   -----------------------------------------------------------------
#   read_interval: 1000            # интервал чтения (мс)            
#   control_interval: 3000         # интервал управления (мс)        
#   trend_interval: 5000           # интервал тренда (мс)            
#   heap_check_interval: 30000     # проверка кучи (мс)              
#   loop_watchdog_timeout: 30000   # таймаут watchdog (мс)           
#   enable_loop_watchdog: True     # включить watchdog
#   udp_discovery_timeout: 30000   # таймаут UDP поиска (мс)         
#   discovery_retry_interval: 1000 # интервал повтора поиска (мс)    
#   heater_control_interval: 200   # интервал управления нагревателем (мс)
#   fan_control_interval: 1000     # интервал управления вентилятором (мс)
#   runaway_check_interval: 5000   # интервал проверки runaway (мс)  
#   unexpected_check_interval: 2000 # интервал проверки неожид. нагрева (мс)
#   rate_check_interval: 1000      # интервал проверки скорости (мс) 
#                                                                    
#   === АВТООТКЛЮЧЕНИЕ ПО MOONRAKER ===                            
#   -----------------------------------------------------------------
#   auto_shutdown_enabled: False   # автоматически выключать нагрев через N минут
#                                  # ПОСЛЕ ЗАВЕРШЕНИЯ печати
#   auto_shutdown_minutes: 30      # время ожидания после окончания печати (мин)
#   
#   📊 КАК ЭТО РАБОТАЕТ:
#   - FLOOK32 опрашивает Moonraker раз в 60 секунд
#   - При переходе "printing" → "standby/complete" запускает таймер
#   - Через auto_shutdown_minutes минут выключает нагрев
#   - При старте новой печати таймер сбрасывается
#   - IP Klipper сохраняется в NVS и восстанавливается после перезагрузки
#   - Статус Moonraker отображается в веб-интерфейсе
#   
#   ⚠️ Moonraker должен быть доступен на порту 7125
#                                                                    
#   === ТЕРМАЛЬНАЯ МОДЕЛЬ ===                                        
#   -----------------------------------------------------------------
#   enable_thermal_model: False    # включить термальную модель      
#   thermal_model_sensitivity: 1.0 # чувствительность модели         
#   thermal_model_check_interval: 2000 # интервал проверки (мс)      
#   thermal_model_log_warnings: True # логировать предупреждения     
#                                                                    
#   === ПИНЫ ===                                                    
#   -----------------------------------------------------------------
#   pin_ssr: 32                     # пин SSR (нагреватель)           
#   pin_fan: 33                     # пин вентилятора                 
#   pin_watchdog: 26                # пин watchdog                    
#   pin_onewire: 21                 # пин OneWire (DS18B20)           
#   pin_max_sck: 18                 # пин SCK (MAX6675)               
#   pin_max_so: 19                  # пин SO (MAX6675)                
#   pin_max_cs: 5                   # пин CS (MAX6675)                
#   pin_buzzer: 25                  # пин пищалки                     
#   pin_led: 27                     # пин LED                         
#                                                                    
#   === ЗУММЕР ===
#   -----------------------------------------------------------------
#   buzzer_enabled: True            # включить бипер
#   buzzer_non_critical_enabled: False # сигнал на некритичные ошибки
#   buzzer_melody: 1                # мелодия (0=короткий, 1=двойной, 2=тревога)
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🖥️ GCODE КОМАНДЫ:                                               
#   -----------------------------------------------------------------
#                                                                    
#   ОСНОВНЫЕ:
#   FLOOK_STATUS                 - показать статус устройства       
#   FLOOK_TEMP                   - показать текущую температуру     
#   FLOOK_SET S=55               - установить целевую температуру   
#   FLOOK_OFF                    - выключить нагрев                 
#   FLOOK_DISCOVER               - принудительный поиск устройств в сети
#   FLOOK_SET_IP IP=192.168.1.37 - установить IP вручную           
#                                                                    
#   УПРАВЛЕНИЕ:
#   FLOOK_UNLOCK [PASSWORD=xxx]  - разблокировать настройки         
#   FLOOK_LOCK                   - заблокировать настройки          
#   FLOOK_REBOOT                 - перезагрузить ESP32              
#   FLOOK_RESET_ID               - сбросить сохраненный ID и начать перепоиск
#                                                                    
#   КОНФИГУРАЦИЯ:
#   FLOOK_CONFIG_GET             - показать текущую конфигурацию    
#   FLOOK_AUTO_SHUTDOWN [ENABLE=1] [MINUTES=30] - управление автооткл.
#   FLOOK_AUTO_SHUTDOWN_STATUS   - статус автоотключения            
#                                                                    
#   ДИАГНОСТИКА:
#   FLOOK_ERRORS                 - показать журнал ошибок           
#   FLOOK_CALIBRATE TEMP=100     - калибровка MAX6675 по эталону
#                                                                    
#   АДАПТАЦИЯ:
#   FLOOK_ADAPT_START TARGET=60  - запуск адаптации                 
#   FLOOK_ADAPT_ABORT            - прервать адаптацию               
#   FLOOK_ADAPT_STATUS           - статус адаптации                 
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🎛️ ИНТЕГРАЦИЯ СО СЛАЙСЕРОМ (M141 / M191):                       
#   -----------------------------------------------------------------
#                                                                    
#   [gcode_macro M141]
#   gcode:
#       {% set S = params.S|default(0)|float %}
#       FLOOK_SET S={S}
#                                                                    
#   [gcode_macro M191]
#   gcode:
#       {% set S = params.S|default(0)|float %}
#       FLOOK_SET S={S}
#       {% if S > 0 %}
#           TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={S-2} MAXIMUM={S+2}
#       {% endif %}
#   -----------------------------------------------------------------
#                                                                    
#   📌 Для интеграции в START_PRINT / END_PRINT используйте:
#   M141 S{CHAMBER}  — установка температуры из слайсера
#   M141 S0          — выключение нагрева по окончании печати
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔌 ОСОБЕННОСТИ РАБОТЫ ПЛАГИНА:                                                 
#   -----------------------------------------------------------------
#                                                                    
#   ✅ UDP-обнаружение с подтверждением ID
#      - Плагин отправляет broadcast с ID устройства (если сохранён)
#      - FLOOK32 отвечает TRUE/FALSE в зависимости от совпадения ID
#      - При первом запуске без ID выбирается устройство с наименьшим uptime
#      - ID сохраняется в Moonraker DB или ~/.flook32_id
#      - При повторных запусках подключается ТОЛЬКО к устройству с сохранённым ID
#      - Для сброса ID: FLOOK_RESET_ID
#
#   ✅ WebSocket поддержка (реальное время)                          
#      - При установке websocket-client данные идут в реальном времени
#      - При отсутствии WebSocket автоматический fallback на HTTP    
#
#   ✅ Сохранение IP Klipper на стороне FLOOK32
#      - IP Klipper сохраняется в NVS при TRUE-ответе на UDP discovery
#      - Восстанавливается после перезагрузки FLOOK32
#      - Для ручного режима: плагин отправляет один UDP-запрос при первом подключении
#
#   ✅ Автоотключение по Moonraker
#      - Работает напрямую через HTTP, не требует плагина
#      - Статус отображается в веб-интерфейсе
#      - IP Klipper не теряется при перезагрузке FLOOK32
#
#   ✅ Поведение при потере связи                                    
#      - Ручной режим: продолжает стучаться по заданному IP          
#      - Автоматический режим: UDP-цикл переподключается             
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔍 ДИАГНОСТИКА ПРОБЛЕМ:                                          
#   -----------------------------------------------------------------
#                                                                    
#   ПРОБЛЕМА: Нет связи с FLOOK32                                   
#   Решение: FLOOK_DISCOVER или FLOOK_RESET_ID                     
#                                                                    
#   ПРОБЛЕМА: Автоотключение не работает                            
#   Проверка: Статус Moonraker в веб-интерфейсе ("🌙 Moonraker не подключён")
#   Решение: Проверьте что Moonraker запущен на порту 7125          
#                                                                    
#   ПРОБЛЕМА: Плагин подключается к чужому FLOOK32                  
#   Решение: FLOOK_RESET_ID                                         
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
